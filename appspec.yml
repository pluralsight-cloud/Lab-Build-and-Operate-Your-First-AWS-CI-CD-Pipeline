version: 0.0
os: linux
file_exists_behavior: OVERWRITE
files:
  - source: index.html
    destination: /var/www/html
  - source: styles.css
    destination: /var/www/html
hooks:
  BeforeInstall:
    - location: scripts/prepare_server.sh
      timeout: 60
      runas: root
  ApplicationStart:
    - location: scripts/restart_server.sh
      timeout: 60
      runas: root
  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 60
      runas: root
